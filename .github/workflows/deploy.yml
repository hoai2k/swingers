name: Deploy to GitHub Pages

# A push to `deploy` deploys the games; nothing else runs here (tests are run
# locally before committing — CLAUDE.md, "Tests and deploys").

# Deploys from the `deploy` branch, not `main`: pushing to main runs nothing,
# and the site is published only when `deploy` is moved forward to main
# (`git push origin main:deploy`; see "Deploy state" in CLAUDE.md).
on:
  push:
    branches: [deploy]
    # Pushes that change nothing the site serves don't deploy: docs (image
    # requests, READMEs, agent notes), tools, agent config and art source files.
    # A push that also changes anything else deploys as usual.
    paths-ignore:
      - '**.md'
      - '.claude/**'
      - '**/tools/**'
      - '**/originals/**'
      - '**/reference/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel, deliberately (as in the mini repo). A deploy that is running
# always finishes, and GitHub keeps one pending run behind it, which a newer
# push replaces for free: during a burst of pushes the site publishes once per
# deploy length, and queued pushes collapse into the newest. Cancelling the
# running deploy instead throws away the minutes it already used, and a steady
# stream of pushes could cancel every deploy before it finished.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # A deploy takes a minute or two. Anything past fifteen is hung, and a hung
    # run would otherwise bill up to six hours and hold the concurrency group,
    # leaving the site stale without reporting a failure (as in jjkbrawler).
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Only what the games load goes into the site. Left out: repo and agent
      # files, docs, tools, and art source material no game loads (~215 MB) —
      # generated originals and reference sheets, and the root game's
      # assets/{bg,heads,tiles,ui} (the games load the assets/web copies).
      - name: Assemble site
        run: |
          mkdir _site
          rsync -a \
            --exclude '.git' --exclude '.github' --exclude '.claude' --exclude '_site' \
            --exclude '*.md' --exclude 'tools/' \
            --exclude 'originals/' --exclude 'reference/' \
            --exclude '/assets/bg/' --exclude '/assets/heads/' --exclude '/assets/tiles/' --exclude '/assets/ui/' \
            ./ _site/
          du -sh _site
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
      # The uploaded site would otherwise sit in Actions storage for a day
      # after every push, which counts against the account's quota while the
      # repository is private. Pages keeps its own copy, so delete ours as
      # soon as the deploy is done.
      - name: Delete the deployed site artifact
        if: always()
        uses: geekyeggo/delete-artifact@v5
        with:
          name: github-pages
          failOnError: false
