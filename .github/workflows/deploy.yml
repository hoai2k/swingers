name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Generated art originals and reference sheets are source material that no
      # game loads (~100 MB); leave them out of the site so deploys stay small.
      - name: Drop art source files from the site
        run: rm -rf */assets/originals */reference */assets/reference assets/originals assets/reference
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
      # The uploaded site would otherwise sit in Actions storage for a day
      # after every push, which counts against the account's quota while the
      # repository is private. Pages keeps its own copy, so delete ours as
      # soon as the deploy is done.
      - name: Delete the deployed site artifact
        if: always()
        uses: geekyeggo/delete-artifact@v5
        with:
          name: github-pages
          failOnError: false
