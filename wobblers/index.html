<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wobblers</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": {
  "three": "./lib/three.module.min.js",
  "three/addons/": "./lib/addons/",
  "rapier": "./lib/rapier.es.js"
} }
</script>
</head>
<body>
<canvas id="view"></canvas>
<div id="hud"></div>
<div id="title" class="screen">
  <div class="sun"></div>
  <div class="clouds"><i></i><i></i><i></i></div>
  <div class="logowrap">
    <div class="logo"><span>W</span><span>o</span><span>b</span><span>b</span><span>l</span><span>e</span><span>r</span><span>s</span></div>
    <div class="tagline">A wobbly island sandbox for 1 to 8 players</div>
  </div>
  <div id="crowd"></div>
  <div class="tbottom">
    <div id="loading"><div class="lbar"><i id="loadbar"></i></div><span>Loading the island… <b id="loadpct">0%</b></span></div>
    <div id="press" class="hidden">
      <div class="bigprompt"><span class="btn bA">A</span> Press to join</div>
      <div class="sub">Keyboard: <span class="key">Enter</span> or <span class="key">Space</span> · second keyboard: <span class="key">NumEnter</span></div>
      <div class="sub"><span class="btn bY">Y</span> or <span class="key">E</span> / <span class="key">F1</span> Controls</div>
    </div>
    <div id="devices"></div>
  </div>
</div>
<div id="help" class="screen hidden"></div>
<div id="toasts"></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
